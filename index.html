<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Dose Vet - Calculadora de Dosagem</title>
<meta name="description" content="Calculadora de dosagem veterinária: líquidos, injetáveis e comprimidos." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23145C5B%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>+</text></svg>">
<style>
  :root{
    --primary:#145C5B;
    --primary-dark:#0D3F3E;
    --bg-soft:#EFF7F5;
    --amber:#C98A3E;
    --amber-soft:#F4E3CB;
    --danger:#C0453A;
    --danger-soft:#FF8A7A;
    --ink:#1F2D2C;
    --ink-soft:#5B6D6B;
    --border:#D8E6E3;
    --teal-soft:#8FC6C0;
  }
  *{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-soft);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  position:relative;
  overflow-x:hidden;
}
.wrap{
  max-width:440px;
  margin:0 auto;
  padding:28px 16px 60px;
  position:relative;
}
  .logo{
    width:36px;height:36px;border-radius:10px;background:var(--primary);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;flex-shrink:0;
  }
  h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin:0;color:var(--primary-dark);}
  .subtitle{margin:6px 0 22px;font-size:14px;color:var(--ink-soft);}

  .toggle{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;
    border:2px solid var(--border);border-radius:12px;padding:4px;
    background:#fff;margin-bottom:20px;
  }
  .toggle button{
    border:none;background:transparent;border-radius:8px;padding:10px 6px;
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
    transition:background .15s,color .15s;
  }
  .toggle button.active{background:var(--primary);color:#fff;}

  .card{
    background:#fff;border:2px solid var(--border);border-radius:16px;
    padding:16px;box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  label{display:block;margin-bottom:14px;}
  label:last-of-type{margin-bottom:0;}
  .label-text{
    display:block;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;
  }
  .field{
    display:flex;align-items:center;border:2px solid var(--border);
    border-radius:12px;background:#fff;padding:0 12px;
  }
  .field input{
    width:100%;border:none;outline:none;background:transparent;
    padding:10px 0;font-size:17px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--ink);
  }
  .field input[type=text]{font-family:inherit;font-size:16px;}
  .field .unit{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;padding-left:8px;}
  .field:focus-within{border-color:var(--primary);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .actions{display:flex;gap:8px;margin-top:16px;}
  .btn{
    border:none;border-radius:12px;padding:11px 14px;font-size:14px;
    font-weight:700;cursor:pointer;
  }
  .btn-primary{flex:1;background:var(--primary);color:#fff;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-secondary{background:var(--amber-soft);color:var(--primary-dark);}

  .result{
    margin-top:16px;border-radius:16px;border:2px solid var(--primary);
    background:var(--primary-dark);padding:20px;
  }
  .result.exceeds{border-color:var(--danger);}
  .result-empty{text-align:center;font-size:14px;color:var(--teal-soft);padding:32px 0;}
  .result-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .result-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-soft);}
  .result-value{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:36px;font-weight:800;
    color:#fff;margin-top:4px;
  }
  .result-value.exceeds{color:var(--danger-soft);}
  .result-value .unit{font-size:17px;font-weight:700;margin-left:4px;}
  .result-formula{margin-top:8px;font-size:12px;font-family:ui-monospace,monospace;color:var(--teal-soft);}
  .result-warning{margin-top:8px;font-size:12px;font-weight:700;color:var(--danger-soft);}
  .syringe-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .syringe-col span{margin-top:4px;font-size:10px;font-weight:700;color:var(--teal-soft);}

  .history{margin-top:24px;}
  .history h2{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-soft);margin:0 0 8px;
  }
  .history ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .history li{
    display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:2px solid var(--border);border-radius:12px;
    padding:10px 14px;
  }
  .history .med{font-size:14px;font-weight:700;color:var(--ink);margin:0;}
  .history .meta{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  .history .val{font-family:ui-monospace,monospace;font-size:14px;font-weight:800;color:var(--primary);}
  .history .del{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:0 0 0 10px;}

  footer{margin-top:32px;text-align:center;font-size:11px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">+</div>
    <h1>Dose Vet</h1>
  </header>
  <p class="subtitle">Calculadora de dosagem para uso clínico veterinário</p>

  <div class="toggle">
    <button id="btn-liquido" class="active">Líquido / Injetável</button>
    <button id="btn-comprimido">Comprimido</button>
  </div>

  <div class="card">
    <label>
      <span class="label-text">Medicamento</span>
      <div class="field"><input id="medicamento" type="text" placeholder="Ex: Agemoxi" /></div>
    </label>

    <div class="grid2">
      <label>
        <span class="label-text">Peso do animal</span>
        <div class="field">
          <input id="peso" type="number" inputmode="decimal" placeholder="10" />
          <span class="unit">kg</span>
        </div>
      </label>
      <label>
        <span class="label-text">Dose</span>
        <div class="field">
          <input id="dose" type="number" inputmode="decimal" placeholder="22" />
          <span class="unit">mg/kg</span>
        </div>
      </label>
    </div>

    <label id="label-conc-liquido">
      <span class="label-text">Concentração do medicamento</span>
      <div class="field">
        <input id="conc-liquido" type="number" inputmode="decimal" placeholder="17.2" />
        <span class="unit">mg/mL</span>
      </div>
    </label>

    <label id="label-conc-comprimido" style="display:none;">
      <span class="label-text">Concentração por comprimido</span>
      <div class="field">
        <input id="conc-comprimido" type="number" inputmode="decimal" placeholder="50" />
        <span class="unit">mg/compr.</span>
      </div>
    </label>

    <div class="actions">
      <button id="btn-salvar" class="btn btn-primary" disabled>Salvar no histórico</button>
      <button id="btn-limpar" class="btn btn-secondary">Limpar</button>
    </div>
  </div>

  <div id="result" class="result">
    <p class="result-empty">Preencha peso, dose e concentração para calcular</p>
  </div>

  <div id="history" class="history" style="display:none;">
    <h2>Histórico</h2>
    <ul id="history-list"></ul>
  </div>

  <footer>Ferramenta de apoio ao cálculo. Sempre confira a dose e a bula antes de administrar.</footer>
</div>

<script>
  const SYRINGE_SIZES = [1, 3, 5, 10, 20, 60];
  let mode = "liquido";

  const el = (id) => document.getElementById(id);
  const medicamentoEl = el("medicamento");
  const pesoEl = el("peso");
  const doseEl = el("dose");
  const concLiquidoEl = el("conc-liquido");
  const concComprimidoEl = el("conc-comprimido");
  const resultEl = el("result");
  const btnSalvar = el("btn-salvar");
  const historyEl = el("history");
  const historyListEl = el("history-list");

  function pickSyringe(volumeML) {
    return SYRINGE_SIZES.find((s) => s >= volumeML) || SYRINGE_SIZES[SYRINGE_SIZES.length - 1];
  }

  function syringeSVG(volumeML, capacityML, exceeds) {
    const barrelH = 150, barrelTop = 30;
    const fillPct = capacityML > 0 ? Math.max(0, Math.min(volumeML / capacityML, 1)) : 0;
    const fillH = barrelH * fillPct;
    const fillColor = exceeds ? "#FF8A7A" : "#C98A3E";
    let ticks = "";
    for (let i = 0; i <= 10; i++) {
      const y = barrelTop + (barrelH / 10) * i;
      const major = i % 5 === 0;
      ticks += `<line x1="52" y1="${y}" x2="${major ? 38 : 44}" y2="${y}" stroke="#5B6D6B" stroke-width="${major ? 1.6 : 1}"/>`;
    }
    return `
    <svg viewBox="0 0 160 230" width="88" height="126">
      <rect x="66" y="0" width="28" height="14" rx="2" fill="#5B6D6B"/>
      <rect x="74" y="12" width="12" height="16" fill="#5B6D6B"/>
      <rect x="52" y="${barrelTop}" width="56" height="${barrelH}" rx="6" fill="white" stroke="#0D3F3E" stroke-width="2.5"/>
      <rect x="54.5" y="${barrelTop + (barrelH - fillH) + 2}" width="51" height="${Math.max(fillH - 4, 0)}" rx="3" fill="${fillColor}" opacity="0.85"/>
      ${ticks}
      <rect x="76" y="${barrelTop + barrelH}" width="8" height="20" fill="#5B6D6B"/>
      <polygon points="76,${barrelTop + barrelH + 20} 84,${barrelTop + barrelH + 20} 80,${barrelTop + barrelH + 32}" fill="#5B6D6B"/>
    </svg>`;
  }

  function setMode(m) {
    mode = m;
    el("btn-liquido").classList.toggle("active", m === "liquido");
    el("btn-comprimido").classList.toggle("active", m === "comprimido");
    el("label-conc-liquido").style.display = m === "liquido" ? "block" : "none";
    el("label-conc-comprimido").style.display = m === "comprimido" ? "block" : "none";
    render();
  }

  el("btn-liquido").addEventListener("click", () => setMode("liquido"));
  el("btn-comprimido").addEventListener("click", () => setMode("comprimido"));

  function getValues() {
    const peso = parseFloat(pesoEl.value);
    const dose = parseFloat(doseEl.value);
    const conc = parseFloat(mode === "liquido" ? concLiquidoEl.value : concComprimidoEl.value);
    return { peso, dose, conc };
  }

  function calcular() {
    const { peso, dose, conc } = getValues();
    if (isNaN(peso) || isNaN(dose) || peso <= 0 || dose <= 0 || isNaN(conc) || conc <= 0) return null;
    const doseTotalMg = peso * dose;
    return doseTotalMg / conc;
  }

  function render() {
    const { peso, dose, conc } = getValues();
    const resultado = calcular();
    btnSalvar.disabled = resultado === null;

    if (resultado === null) {
      resultEl.className = "result";
      resultEl.innerHTML = `<p class="result-empty">Preencha peso, dose e concentração para calcular</p>`;
      return;
    }

    const unidade = mode === "liquido" ? "mL" : "compr.";
    const rotulo = mode === "liquido" ? "Volume a aspirar" : "Fração de comprimido";
    let capacidade = null, excede = false, syringeHtml = "";

    if (mode === "liquido") {
      capacidade = pickSyringe(resultado);
      excede = resultado > capacidade;
      syringeHtml = `
        <div class="syringe-col">
          ${syringeSVG(resultado, capacidade, excede)}
          <span>seringa ${capacidade} mL</span>
        </div>`;
    }

    resultEl.className = "result" + (excede ? " exceeds" : "");
    resultEl.innerHTML = `
      <div class="result-row">
        <div>
          <div class="result-label">${rotulo}</div>
          <div class="result-value${excede ? " exceeds" : ""}">${resultado.toFixed(2)}<span class="unit">${unidade}</span></div>
          <div class="result-formula">${dose} × ${peso} ÷ ${conc} = ${resultado.toFixed(2)}</div>
          ${excede ? `<div class="result-warning">Volume acima da seringa de ${capacidade} mL — considere dividir a dose</div>` : ""}
        </div>
        ${syringeHtml}
      </div>`;
  }

  [medicamentoEl, pesoEl, doseEl, concLiquidoEl, concComprimidoEl].forEach((i) =>
    i.addEventListener("input", render)
  );

  // History (persisted locally on the device via localStorage)
  const STORAGE_KEY = "dose-vet-history";
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveHistory(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function renderHistory() {
    const list = loadHistory();
    historyEl.style.display = list.length ? "block" : "none";
    historyListEl.innerHTML = list.map((h) => `
      <li>
        <div>
          <p class="med">${h.medicamento}</p>
          <p class="meta">${h.peso}kg · ${h.dose}mg/kg</p>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="val">${h.resultado.toFixed(2)} ${h.modo === "liquido" ? "mL" : "compr."}</span>
          <button class="del" data-id="${h.id}" aria-label="Remover">✕</button>
        </div>
      </li>`).join("");
    historyListEl.querySelectorAll(".del").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        saveHistory(loadHistory().filter((h) => h.id !== id));
        renderHistory();
      });
    });
  }

  btnSalvar.addEventListener("click", () => {
    const resultado = calcular();
    if (resultado === null) return;
    const { peso, dose } = getValues();
    const entry = {
      id: Date.now(),
      medicamento: medicamentoEl.value || "Medicamento",
      peso, dose, modo: mode, resultado,
    };
    const list = [entry, ...loadHistory()].slice(0, 12);
    saveHistory(list);
    renderHistory();
  });

  el("btn-limpar").addEventListener("click", () => {
    medicamentoEl.value = "";
    pesoEl.value = "";
    doseEl.value = "";
    concLiquidoEl.value = "";
    concComprimidoEl.value = "";
    render();
  });

  render();
  renderHistory();
</script>
</body>
</html>
